[package]
name = "sylvia-router"
version = "0.4.7"
authors = ["Chien-Hong Chan"]
categories = ["web-programming::http-server"]
description = "A simple router application with full Sylvia-IoT core components."
edition = "2024"
keywords = ["iot", "router"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/woofdogtw/sylvia-iot-core.git"
rust-version = "1.95.0"

[dependencies]
axum = "0.8.9"
axum-prometheus = "0.10.1"
axum-server = { version = "0.8.0", features = ["tls-rustls"] }
chrono = { version = "0.4.45", default-features = false, features = ["serde"] }
clap = { version = "4.6.7", default-features = false, features = [
    "std",
    "help",
    "usage",
    "error-context",
] }
ipnet = "2.12.2"
json5 = "1.3.2"
log = "0.4.34"
reqwest = { version = "0.13.5", default-features = false, features = [
    "json",
    "rustls",
] }
rustls = "0.23.46"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_urlencoded = "0.7.1"
sylvia-iot-auth = "0.4.7"
sylvia-iot-broker = "0.4.7"
sylvia-iot-corelib = "0.4.7"
sylvia-iot-coremgr = "0.4.7"
sylvia-iot-coremgr-cli = "0.4.7"
sylvia-iot-data = "0.4.7"
sylvia-iot-sdk = "0.4.7"
sysinfo = "0.39.6"
tokio = { version = "1.53.3", features = [
    "io-util",
    "macros",
    "rt-multi-thread",
    "time",
] }
tower = "0.5.3"
tower-http = { version = "0.7.1", default-features = false, features = [
    "cors",
    "fs",
    "normalize-path",
    "timeout",
] }

[profile.release]
codegen-units = 1
lto = true
strip = true
