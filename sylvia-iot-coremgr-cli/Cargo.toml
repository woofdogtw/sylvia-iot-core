[package]
name = "sylvia-iot-coremgr-cli"
version = "0.4.8"
authors = ["Chien-Hong Chan"]
categories = ["web-programming::http-client"]
description = "The command-line tool for Sylvia-IoT core manager."
edition = "2024"
keywords = ["iot"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/woofdogtw/sylvia-iot-core.git"
rust-version = "1.95.0"

[dependencies]
chrono = { version = "0.4.45", default-features = false, features = ["serde"] }
clap = { version = "4.6.9", default-features = false, features = [
    "std",
    "help",
    "usage",
    "error-context",
] }
dirs = "7.0.0"
hex = "0.4.3"
json5 = "1.3.7"
reqwest = { version = "0.13.5", default-features = false, features = [
    "form",
    "json",
    "rustls",
    "stream",
] }
rpassword = "7.5.5"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
serde_urlencoded = "0.7.1"
sylvia-iot-corelib = "0.4.7"
tokio = { version = "1.54.1", features = [
    "io-util",
    "macros",
    "rt-multi-thread",
    "time",
] }
url = "2.5.8"

[dev-dependencies]
laboratory = "2.0.0"

[profile.release]
codegen-units = 1
lto = true
strip = true

[profile.test]
incremental = true
